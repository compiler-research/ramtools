name: clang-tidy-review

on:
  pull_request:
    paths:
      - '**.h'
      - '**.cxx'
      - '.github/workflows/clang-tidy-review.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      # clang-tidy takes the include paths from build/compile_commands.json,
      # so the configure must succeed: it uses the container's gcc, as the
      # build job does, because ROOT's CMake config needs OpenMP. A failed
      # configure fails the job instead of reviewing without any headers.
      - name: Run clang-tidy
        uses: ZedThree/clang-tidy-review@v0.21.0
        id: review
        with:
          build_dir: build
          apt_packages: cmake,libxml2,libxml2-dev,libtinfo-dev,zlib1g-dev,libzstd-dev,libvdt-dev,libtbb-dev,libhts-dev,pkg-config,wget
          split_workflow: true
          config_file: .clang-tidy
          install_commands: |
            wget -q -O root.tar.gz "https://github.com/root-project/root/releases/download/v6-38-06/root_v6.38.06.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz" &&
            tar -xzf root.tar.gz -C /opt/ &&
            rm root.tar.gz
          cmake_command: >
            bash -x -c '
            source /opt/root/bin/thisroot.sh &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            -DBUILD_SHARED_LIBS=ON
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DRAMTOOLS_BUILD_TESTS=ON
            -DRAMTOOLS_BUILD_TOOLS=ON
            -DRAMTOOLS_BUILD_BENCHMARKS=ON &&
            cmake --build build --target googletest googlebenchmark --parallel $(nproc --all)'

      - name: Upload artifacts
        if: always()
        uses: ZedThree/clang-tidy-review/upload@v0.21.0
